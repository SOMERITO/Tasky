<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tasky - Pro Edition</title>
    <style>
        /* Variables Estilo Apple (iOS / macOS) */
        :root {
            --system-blue: #007AFF;
            --system-red: #FF3B30;
            --system-orange: #FF9500;
            --system-gray: #8E8E93;
            --whatsapp-green: #34C759;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* Efecto resorte Apple */
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            color: var(--text-main);
            display: flex; justify-content: center;
            min-height: 100vh;
            padding: 40px 20px 140px 20px;
            background: linear-gradient(-45deg, #FFB3BA, #FFDFBA, #BAFFC9, #BAE1FF, #E0C3FC, #FFC3A0);
            background-size: 600% 600%;
            animation: moveBackground 25s ease-in-out infinite;
            background-attachment: fixed;
        }

        @keyframes moveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { width: 100%; max-width: 750px; }

        header { margin-bottom: 30px; text-align: center; }

        h1 {
            font-size: 3.5rem; font-weight: 800; margin: 0;
            background: linear-gradient(90deg, #007AFF, #5856D6, #FF2D55, #FF9500, #34C759, #007AFF);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientTitle 6s linear infinite;
            letter-spacing: -1.5px;
        }

        @keyframes gradientTitle {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ANIMACIONES PROFESIONALES (Cards y Tasks) */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInTask {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Tarjetas (Fases) */
        .activity-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 30px; margin-bottom: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: slideUpFade 0.6s var(--transition) both;
        }

        .activity-card:hover {
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.12);
        }

        .activity-header { margin-bottom: 15px; }
        
        .title-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }

        .activity-title {
            font-size: 1.4rem; font-weight: 700; color: var(--text-main);
            border: none; padding: 4px 0; width: 85%; background: transparent;
            outline: none; letter-spacing: -0.5px; transition: var(--transition);
        }
        
        /* Barra de progreso Apple Style */
        .progress-container {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 15px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .progress-bar-bg {
            flex-grow: 1; height: 6px; background: rgba(0,0,0,0.08);
            border-radius: 10px; overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%; width: 0%; background: var(--system-blue);
            border-radius: 10px; transition: width 0.6s var(--bounce);
        }
        
        .progress-text { font-size: 0.85rem; font-weight: 600; color: var(--system-gray); }

        /* Lista de Tareas */
        .task-list {
            list-style: none; counter-reset: task-counter;
            display: flex; flex-direction: column; gap: 8px;
        }

        .task-item {
            display: flex; align-items: flex-start;
            background: rgba(255, 255, 255, 0.8);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: var(--transition);
            animation: slideInTask 0.4s var(--transition) both;
        }

        /* LÓGICA DE URGENCIA (CRÍTICO) */
        .task-item.is-critical {
            background: rgba(255, 59, 48, 0.05);
            border: 1px solid rgba(255, 59, 48, 0.3);
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.1);
        }
        
        .task-item.is-critical .task-input { font-weight: 600; }

        .task-item:focus-within {
            background: #FFFFFF;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); transform: scale(1.01);
        }

        /* Botón de urgencia (Con animación Bounce) */
        .btn-priority {
            background: transparent; border: none; cursor: pointer;
            font-size: 1.2rem; color: #D1D5DB; margin-right: 8px;
            transition: transform 0.3s var(--bounce), color 0.3s;
            padding-top: 2px;
        }
        
        .btn-priority:active { transform: scale(0.6); }
        .is-critical .btn-priority { color: var(--system-red); transform: scale(1.1); }

        /* Checkbox (Con animación Bounce) */
        .btn-check {
            width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid #C7C7CC; background: transparent; cursor: pointer;
            margin-right: 12px; flex-shrink: 0; margin-top: 2px;
            transition: transform 0.3s var(--bounce), border-color 0.2s, background 0.2s;
        }
        
        .btn-check:hover { border-color: var(--system-blue); }
        .btn-check:active { transform: scale(0.7); } /* Efecto físico al tocar */

        /* Multilínea (Textarea) */
        .task-input {
            flex-grow: 1; border: none; padding: 4px;
            font-size: 1.05rem; color: var(--text-main);
            background: transparent; outline: none; width: 100%;
            resize: none; overflow: hidden;
            font-family: inherit; line-height: 1.4;
        }
        .task-input::placeholder { color: #C7C7CC; }

        /* ======== COMPLETADAS ======== */
        .completed-card { background: rgba(255,255,255,0.4); border: 1px dashed rgba(0,0,0,0.1); }
        .task-item.completed {
            background: transparent; border: none; border-bottom: 1px solid rgba(0,0,0,0.05);
            border-radius: 0; animation: none;
        }
        .task-item.completed .task-input { text-decoration: line-through; color: var(--system-gray); font-weight: normal;}
        .task-item.completed .btn-priority { display: none; }
        .task-item.completed .btn-check { background: var(--system-blue); border-color: var(--system-blue); position: relative; }
        .task-item.completed .btn-check::after {
            content: ''; position: absolute; left: 7px; top: 4px;
            width: 5px; height: 11px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }

        /* Botones e Iconos */
        .btn-icon { 
            background: transparent; border: none; cursor: pointer; padding: 8px; color: #C7C7CC;
            transition: transform 0.2s var(--bounce), color 0.2s;
        }
        .btn-icon:active { transform: scale(0.8); }
        
        .btn-remove-task { opacity: 0; transform: scale(0.8); }
        .task-item:hover .btn-remove-task, .task-item:focus-within .btn-remove-task { opacity: 1; transform: scale(1); }
        .btn-remove-task:hover { color: var(--system-red); }
        .drag-handle { cursor: grab; color: #D1D5DB; padding: 4px; margin-top: 2px; }

        .btn-add-activity {
            background: rgba(255, 255, 255, 0.5); color: var(--system-blue);
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: var(--radius-lg);
            padding: 16px; width: 100%; font-size: 1.15rem; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(10px); display: flex; justify-content: center; gap: 8px; margin-bottom: 30px;
            transition: transform 0.3s var(--bounce), background 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .btn-add-activity:active { transform: scale(0.97); }
        .btn-add-activity:hover { background: rgba(255, 255, 255, 0.8); }

        .fab-whatsapp {
            position: fixed; bottom: 40px; right: 40px;
            background: var(--whatsapp-green); color: white; border: none; border-radius: 50%;
            width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(52, 199, 89, 0.4); cursor: pointer; z-index: 1000;
            transition: transform 0.3s var(--bounce), background 0.3s;
        }
        .fab-whatsapp:hover { transform: translateY(-5px) scale(1.08); }
        .fab-whatsapp:active { transform: scale(0.9); }

        /* Toast */
        .toast {
            position: fixed; top: -80px; left: 50%; transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px);
            color: white; padding: 16px 32px; border-radius: 30px; font-weight: 500;
            transition: top 0.5s var(--bounce); z-index: 1001;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .toast.show { top: 40px; }

        @media (max-width: 768px) {
            body { padding: 20px 15px 120px 15px; }
            .activity-card { padding: 20px 15px; }
            .btn-remove-task { opacity: 1; transform: scale(1); }
            .drag-handle { display: none; }
            .fab-whatsapp { bottom: 25px; right: 25px; width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header><h1>Tasky</h1></header>
        
        <div id="activities-container"></div>

        <button class="btn-add-activity" onclick="addActivity('')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="22" height="22" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Añadir Nueva Fase
        </button>

        <div id="completed-container" class="activity-card completed-card" style="display: none;">
            <div class="activity-header">
                <div class="title-row"><h2 class="activity-title" readonly>✅ Completadas</h2></div>
            </div>
            <div class="task-list" id="global-completed-list"></div>
        </div>
        
        <button class="fab-whatsapp" onclick="copyToWhatsApp()">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
    </div>

    <div id="toast" class="toast">
        <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" width="22" height="22" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        Ruta copiada para WhatsApp
    </div>

    <script>
        document.addEventListener('input', (e) => {
            if(e.target.classList.contains('task-input')) {
                autoResizeTextarea(e.target);
                updateLogic(); // Solo actualiza la barra de progreso
            }
            saveData();
        });

        window.onload = () => { loadData(); };

        function getTodayString() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        // Auto-resize para el text-area (Multilínea)
        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        // ==========================================
        // LÓGICA DE PROGRESO (Sin Bloqueo de Tareas)
        // ==========================================
        function updateLogic() {
            document.querySelectorAll('.activity-card:not(.completed-card)').forEach(card => {
                const tasks = card.querySelectorAll('.task-item:not(.completed)');
                let total = 0; let done = 0;

                tasks.forEach(task => {
                    const input = task.querySelector('.task-input');
                    // Contamos las que tienen texto
                    if(input && input.value.trim() !== '') total++;
                });

                const cardId = card.id;
                const completedInGlobal = document.querySelectorAll(`.task-item.completed[data-origin-id="${cardId}"]`).length;
                total += completedInGlobal;
                done += completedInGlobal;

                // Animación de Barra de Progreso
                const progressText = card.querySelector('.progress-text');
                const progressFill = card.querySelector('.progress-bar-fill');
                if(progressText) progressText.innerText = `${done}/${total}`;
                
                let percent = total === 0 ? 0 : (done / total) * 100;
                if(progressFill) progressFill.style.width = `${percent}%`;
            });
        }

        function togglePriority(btn) {
            const task = btn.closest('.task-item');
            task.classList.toggle('is-critical');
            saveData();
        }

        function saveData() {
            const data = { categories: [], completed: [] };
            document.querySelectorAll('.activity-card:not(.completed-card)').forEach(card => {
                const title = card.querySelector('.activity-title').value;
                const tasks = [];
                card.querySelectorAll('.task-item:not(.completed)').forEach(t => {
                    const text = t.querySelector('.task-input').value;
                    if(text.trim() !== '') {
                        tasks.push({ text, date: t.dataset.date, critical: t.classList.contains('is-critical') });
                    }
                });
                data.categories.push({ title, tasks });
            });
            document.querySelectorAll('.task-item.completed').forEach(t => {
                const text = t.querySelector('.task-input').value;
                if(text.trim() !== '') data.completed.push({ text, date: t.dataset.date, origin: t.dataset.originId });
            });
            localStorage.setItem('tasky_pro_v3', JSON.stringify(data));
        }

        function loadData() {
            const dataStr = localStorage.getItem('tasky_pro_v3');
            if (dataStr) {
                const data = JSON.parse(dataStr);
                if(data.categories && data.categories.length > 0) {
                    data.categories.forEach((cat, index) => {
                        // Añadimos un leve retraso para que las tarjetas entren en cascada (Staggered animation)
                        setTimeout(() => {
                            const card = addActivity(cat.title, false);
                            const list = card.querySelector('.task-list');
                            cat.tasks.forEach(task => {
                                const input = createTaskElement(list, null, task.date);
                                input.value = task.text;
                                if(task.critical) input.closest('.task-item').classList.add('is-critical');
                                setTimeout(()=> autoResizeTextarea(input), 0);
                            });
                            createTaskElement(list, null, getTodayString()); 
                        }, index * 150); 
                    });
                }
                if (data.completed && data.completed.length > 0) {
                    setTimeout(() => {
                        const globalList = document.getElementById('global-completed-list');
                        document.getElementById('completed-container').style.display = 'block';
                        data.completed.forEach(task => {
                            const input = createTaskElement(globalList, null, task.date);
                            input.value = task.text;
                            const taskItem = input.closest('.task-item');
                            taskItem.classList.add('completed');
                            taskItem.dataset.originId = task.origin;
                        });
                        updateLogic();
                    }, data.categories ? data.categories.length * 150 : 100);
                }
            } else {
                addActivity('☀️ Fase 1: Mañana / Casa');
                setTimeout(() => { addActivity('🏃 Fase 2: Ruta / Compras'); }, 200);
            }
        }

        let activityCounter = 0;
        function addActivity(title = '', createEmptyTask = true) {
            activityCounter++;
            const container = document.getElementById('activities-container');
            const card = document.createElement('div');
            card.className = 'activity-card'; card.id = 'activity-' + activityCounter;
            
            card.innerHTML = `
                <div class="activity-header">
                    <div class="title-row">
                        <input type="text" class="activity-title" value="${title}" placeholder="Fase o Bloque de tiempo...">
                        <button class="btn-icon" onclick="this.closest('.activity-card').remove(); updateLogic(); saveData();">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
                        <span class="progress-text">0/0</span>
                    </div>
                </div>
                <div class="task-list"></div>
            `;
            container.appendChild(card);
            
            if(createEmptyTask) createTaskElement(card.querySelector('.task-list'), null, getTodayString());
            updateLogic(); saveData();
            return card;
        }

        function createTaskElement(listContainer, insertAfter = null, dateStr = null) {
            const task = document.createElement('div');
            task.className = 'task-item';
            task.dataset.date = dateStr || getTodayString();

            task.innerHTML = `
                <div class="drag-handle"><svg width="18" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="18" x2="16" y2="18"></line></svg></div>
                <button class="btn-priority" onclick="togglePriority(this)" title="Marcar urgente">🚩</button>
                <div class="btn-check" onclick="toggleComplete(this)"></div>
                <textarea class="task-input" rows="1" placeholder="Añadir tarea..." onkeydown="handleEnter(event, this)" onpaste="handlePaste(event, this)"></textarea>
                <button class="btn-icon btn-remove-task" tabindex="-1" onclick="this.parentElement.remove(); updateLogic(); saveData();">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            `;
            
            if (insertAfter) insertAfter.after(task);
            else listContainer.appendChild(task);
            return task.querySelector('.task-input');
        }

        function handlePaste(event, input) {
            const text = (event.clipboardData || window.clipboardData).getData('text');
            if (text.includes('\n')) {
                event.preventDefault();
                const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length === 0) return;
                input.value = lines[0]; autoResizeTextarea(input);
                let currentItem = input.closest('.task-item');
                const list = currentItem.parentElement;
                
                for (let i = 1; i < lines.length; i++) {
                    // Timeout ligero para que la animación de entrada se note en pegado múltiple
                    setTimeout(() => {
                        const newInput = createTaskElement(list, currentItem, getTodayString());
                        newInput.value = lines[i]; autoResizeTextarea(newInput);
                        currentItem = newInput.closest('.task-item');
                        if (i === lines.length - 1) {
                            currentItem.querySelector('.task-input').focus();
                            updateLogic(); saveData();
                        }
                    }, i * 50);
                }
            }
        }

        function toggleComplete(btn) {
            const taskItem = btn.closest('.task-item');
            const isCompleted = taskItem.classList.contains('completed');
            const globalList = document.getElementById('global-completed-list');
            const container = document.getElementById('completed-container');

            // Animación de salida antes de mover la tarea
            taskItem.style.opacity = '0'; 
            taskItem.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                if (!isCompleted) {
                    taskItem.classList.add('completed');
                    taskItem.dataset.originId = taskItem.closest('.activity-card').id; 
                    globalList.appendChild(taskItem);
                    container.style.display = 'block'; 
                } else {
                    taskItem.classList.remove('completed');
                    const originCard = document.getElementById(taskItem.dataset.originId);
                    if (originCard) originCard.querySelector('.task-list').appendChild(taskItem);
                    else {
                        const first = document.querySelector('.activity-card:not(.completed-card)');
                        if(first) first.querySelector('.task-list').appendChild(taskItem);
                    }
                    if(globalList.children.length === 0) container.style.display = 'none';
                }
                
                // Reset de animación al llegar a su nuevo destino
                setTimeout(() => {
                    taskItem.style.opacity = '1'; 
                    taskItem.style.transform = 'scale(1)';
                }, 50);
                
                updateLogic(); saveData();
            }, 250);
        }

        function handleEnter(e, input) {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault();
                if(input.closest('.task-item').classList.contains('completed')) return; 
                const current = input.closest('.task-item');
                const newInput = createTaskElement(current.parentElement, current, getTodayString());
                newInput.focus();
                updateLogic(); saveData();
            }
        }

        function copyToWhatsApp() {
            let text = '';
            document.querySelectorAll('.activity-card:not(.completed-card)').forEach(card => {
                const title = card.querySelector('.activity-title').value.trim();
                const tasks = card.querySelectorAll('.task-item:not(.completed)');
                const validTasks = Array.from(tasks).filter(t => t.querySelector('.task-input').value.trim() !== '');

                if (title !== '' && validTasks.length > 0) {
                    text += `*${title}*\n`;
                    validTasks.forEach((task, index) => {
                        let content = task.querySelector('.task-input').value.trim();
                        if(task.classList.contains('is-critical')) content = `🚨 *${content}*`;
                        text += `${index + 1}. ${content}\n`;
                    });
                    text += `\n`; 
                }
            });

            const completed = Array.from(document.querySelectorAll('.task-item.completed .task-input'))
                                  .map(i => i.value.trim()).filter(v => v !== '');
            if (completed.length > 0) {
                text += `*✅ Completadas*\n`;
                completed.forEach(t => text += `~${t}~\n`);
                text += `\n`; 
            }

            if(text.trim() === '') { alert('Escribe tareas primero.'); return; }

            navigator.clipboard.writeText(text.trim()).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
            }).catch(e => alert('Error: ' + e));
        }
    </script>
</body>
</html>
